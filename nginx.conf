# ==========================================================================
# 文字冒险合集 · 静态站点 Nginx 配置
#
# 使用方式（任选其一）：
#   1. 复制为 /etc/nginx/conf.d/webtxtgame.conf
#   2. 复制为 /etc/nginx/sites-available/webtxtgame，并建立软链接：
#      ln -s /etc/nginx/sites-available/webtxtgame /etc/nginx/sites-enabled/
#
# 说明：
#   - 本文件是一个 server 块，需放入 http {} 上下文（系统默认配置已 include mime.types）。
#   - 将 root 指向部署目录，即包含 index.html、edit.html、admin.html、rules.json 与 src/ 的目录。
#   - 全部资源使用相对路径，站点可部署在任意域名或子路径之外（如需子路径，请配合 location 前缀调整）。
#   - 端口约定（按自己的环境改这两处即可）：
#       网页(本站)  listen 8089;
#       后端(API)   proxy_pass http://127.0.0.1:8090;
#     前端请求的是同源路径 /api/...，由本文件转发到后端，因此前端代码无需任何改动。
#   - 两种部署方式：
#       a) 纯静态：只部署本文件即可，发布/审核功能不可用（编辑器仍可导出 JSON）。
#       b) 带发布审核：另外运行 `node server.js`（监听 8090，见下方 proxy_pass）。
#          此时不要再让 nginx 直接暴露 storage/ 目录（下面已用 location ^~ /storage/ 屏蔽）。
# ==========================================================================

server {
    listen 8089;                   # 网页(本站)监听端口
    listen [::]:8089;
    server_name _;                 # 替换为你的域名，例如 game.lyxsmcs.top

    root /var/www/webtxtgame;      # 替换为实际部署目录
    index index.html;

    charset utf-8;

    # gzip 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    # 安全响应头
    # X-Frame-Options 使用 SAMEORIGIN：允许编辑器（edit.html）内嵌同源 iframe 预览故事
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 首页
    location = / {
        try_files /index.html =404;
    }

    # ----------------------------------------------------------------------
    # 缓存策略说明（出现「样式/脚本是旧版本」的问题请看这里）
    #
    # 本项目是手写静态资源，靠 URL 上的 ?v= 版本号来让浏览器与 CDN 取到新文件。
    # 要让这套机制生效，必须保证 CDN 的缓存键包含查询字符串：
    #   Cloudflare → 缓存 → 「缓存级别 / Caching Level」必须选 Standard；
    #   选成 Ignore Query String 或 No Query String 时，?v=2 与 ?v=7 会被当成
    #   同一个缓存条目，于是页面换了新 HTML、CSS 却一直是旧缓存。
    # 另外确认没有对全站开启 Cache Everything 的页面规则；若有，请把 /src/ 排除，
    # 或给 /src/* 设置 Cache Level = Bypass。
    # 每次部署后建议执行一次「清除缓存（Purge Everything）」。
    #
    # 自检命令（判断 CDN 给的是新文件还是旧文件）：
    #   curl -sI https://你的域名/src/js/editor.js | grep -iE 'cf-cache-status|cache-control|age'
    #   curl -s  https://你的域名/src/js/editor.js | grep -c renderFlowChoices
    #   第二条返回 0 说明拿到的是旧文件。
    # ----------------------------------------------------------------------

    # HTML 页面：完全不缓存，保证每次都是最新的页面结构
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # CSS / JS / JSON：使用协商缓存（no-cache + ETag）
    # 内容未变返回 304；内容一变立即生效，配合页面里的 ?v= 版本号可绕过 CDN 旧缓存。
    location ~* \.(?:css|js|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 图片与字体：内容基本不变，缓存 7 天
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 投稿与审核数据由 server.js 读写，禁止通过静态方式访问
    location ^~ /storage/ {
        return 404;
    }

    # 发布与审核接口：反向代理到后端服务
    # 后端端口需与 node server.js 的监听端口一致（此处 8090）。
    # 若不使用发布/审核功能（纯静态部署），可以删除这个 location。
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其余请求回退到 404
    location / {
        try_files $uri $uri/ =404;
    }
}

